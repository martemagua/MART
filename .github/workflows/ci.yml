name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }   # the work laptop
          - { os: windows-latest, python: "3.14" }   # Martin's personal PC
          - { os: ubuntu-latest,  python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test-only tools. MART itself installs nothing: it runs on the standard
      # library, openpyxl (preinstalled on the work laptop) and vendor/.
      - run: python -m pip install pytest==9.2.0 openpyxl==3.1.5 ruff
      - run: ruff check .
      - run: python -m pytest
      # The launcher must find Python on its own (no PATH tricks).
      - name: MART.bat finds Python and passes its start-up check
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MART_NO_PAUSE: "1"
        run: MART.bat check
      - run: python tools/build_zip.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        with:
          name: MART-zip
          path: dist/*.zip
