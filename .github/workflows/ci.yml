name: CI

# One run per change: pull requests into main, pushes to main (the merge),
# and by hand from the Actions tab. A push to a PR branch is tested through
# its PR, not a second time as a push. Windows only: MART runs on Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run it replaces (runs on main all finish).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]   # the work laptop, Martin's personal PC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Test-only tools. MART itself installs nothing: it runs on the standard
      # library, openpyxl (preinstalled on the work laptop) and vendor/.
      - run: python -m pip install pytest==9.2.0 openpyxl==3.1.5 ruff
      - run: ruff check .
      - run: python -m pytest
      # The launcher must find Python on its own (no PATH tricks).
      - name: MART.bat finds Python and passes its start-up check
        shell: cmd
        env:
          MART_NO_PAUSE: "1"
        run: MART.bat check
      - name: make-zip.bat builds and tests the zip
        shell: cmd
        env:
          MART_NO_PAUSE: "1"
        run: make-zip.bat --no-pull
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: MART-zip
          path: dist/*.zip
