<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MART{% endblock %} · MART</title>
<script>if (window.self !== window.top) document.documentElement.classList.add("is-embedded");</script>
<link rel="stylesheet" href="/static/mart.css">
{% block head %}{% endblock %}
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Main">
    <a class="brand" href="/">
      <span class="brand-name">MART</span>
      <span class="brand-sub">renewals</span>
    </a>
    {% if not setup_mode %}
    <a class="nav-link {% if active == 'home' %}is-active{% endif %}" href="/">Home</a>
    <a class="nav-link {% if active == 'clients' %}is-active{% endif %}" href="/clients">Clients</a>
    <a class="nav-link {% if active == 'board' %}is-active{% endif %}" href="/board">Board</a>
    <a class="nav-link {% if active == 'todos' %}is-active{% endif %}" href="/todos">To-dos</a>
    <a class="nav-link {% if active == 'insurers' %}is-active{% endif %}" href="/insurers">Insurers</a>
    <a class="nav-link {% if active == 'uploads' %}is-active{% endif %}" href="/uploads">Uploads</a>
    <a class="nav-link {% if active == 'settings' %}is-active{% endif %}" href="/settings">Settings</a>
    {% endif %}
    <div class="sidebar-foot">
      <span>MART {{ version }}</span>
      <span>{{ release }}</span>
    </div>
  </nav>
  <main class="content {% block content_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/mart.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
